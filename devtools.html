<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SWITCH DevTools</title>
  <style>
    :root {
      --brand:     #35A3C7;
      --bg:        #f8fafc;
      --card:      #ffffff;
      --border:    #e2e8f0;
      --text:      #1e293b;
      --muted:     #64748b;
      --danger:    #ef4444;
      --success:   #10b981;
      --radius:    8px;
      --font-mono: 'SF Mono','Cascadia Code','Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────────── */
    .app-header {
      background: linear-gradient(135deg, #35A3C7, #2892B6);
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-header h1 { font-size: 18px; font-weight: 700; }
    .app-header .subtitle { font-size: 12px; opacity: 0.75; margin-top: 2px; }

    .container { max-width: 860px; margin: 0 auto; padding: 28px 24px; }

    /* ── Section ──────────────────────────────────────────── */
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .section-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
    }
    .section-head h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .section-body { padding: 16px 18px; }

    /* ── Sites list ───────────────────────────────────────── */
    .site-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .site-row:last-child { border-bottom: none; }
    .site-info { display: flex; flex-direction: column; gap: 4px; }
    .site-domain { font-weight: 600; font-size: 14px; }
    .site-meta   { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
    .status-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.active { background: var(--success); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
    .status-dot.off    { background: #cbd5e1; }

    .btn-remove {
      width: 28px; height: 28px; border: none; border-radius: 6px;
      background: transparent; color: #cbd5e1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, background 0.15s; flex-shrink: 0; padding: 0;
    }
    .btn-remove:hover { color: var(--danger); background: rgba(239,68,68,0.08); }

    /* Add-site form */
    .add-form {
      display: flex; gap: 8px; margin-top: 14px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .add-form input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: var(--font-mono);
    }
    .add-form input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(53,163,199,0.15); }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      padding: 7px 14px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: #2892B6; }
    .btn-danger  { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .btn-danger:hover  { background: rgba(239,68,68,0.18); }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .btn-row { display: flex; gap: 8px; }

    /* ── Code blocks ──────────────────────────────────────── */
    pre {
      background: #0f172a; color: #e2e8f0;
      font-family: var(--font-mono); font-size: 11px;
      padding: 14px; border-radius: 6px;
      max-height: 280px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
      line-height: 1.5;
    }

    /* ── Cookie blocks ────────────────────────────────────── */
    .cookie-block { margin-bottom: 14px; }
    .cookie-block:last-child { margin-bottom: 0; }
    .cookie-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .cookie-header strong { font-size: 13px; }
    .badge {
      background: rgba(53,163,199,0.12); color: var(--brand);
      font-size: 11px; font-weight: 600; border-radius: 10px;
      padding: 2px 8px;
    }
    .cookie-list {
      max-height: 120px; font-size: 11px;
      background: #f1f5f9; color: #475569;
    }

    /* ── Misc ─────────────────────────────────────────────── */
    .empty { color: var(--muted); font-size: 13px; font-style: italic; }

    .danger-zone { border-color: rgba(239,68,68,0.3); }
    .danger-zone .section-head { background: rgba(239,68,68,0.04); }
    .danger-zone .section-head h2 { color: var(--danger); }
  </style>
</head>
<body>

<header class="app-header">
  <svg width="28" height="28" viewBox="0 0 32 32" fill="white">
    <path d="M29.83,20l.34-2L25,17.15V13c0-.08,0-.15,0-.23l5.06-1.36-.51-1.93-4.83,1.29A9,9,0,0,0,20,5V2H18V4.23a8.81,8.81,0,0,0-4,0V2H12V5a9,9,0,0,0-4.71,5.82L2.46,9.48,2,11.41,7,12.77c0,.08,0,.15,0,.23v4.15L1.84,18l.32,2L7,19.18a8.9,8.9,0,0,0,.82,3.57L3.29,27.29l1.42,1.42,4.19-4.2a9,9,0,0,0,14.2,0l4.19,4.2,1.42-1.42-4.54-4.54A8.9,8.9,0,0,0,25,19.18ZM15,25.92A7,7,0,0,1,9,19V13h6ZM9.29,11a7,7,0,0,1,13.42,0ZM23,19a7,7,0,0,1-6,6.92V13h6Z"/>
  </svg>
  <div>
    <h1>SWITCH DevTools</h1>
    <div class="subtitle">Debug &amp; configuration panel</div>
  </div>
</header>

<div class="container">

  <!-- ── Managed Sites ────────────────────────────────────── -->
  <div class="section">
    <div class="section-head">
      <h2>Managed Sites</h2>
    </div>
    <div class="section-body">
      <div id="sitesList"><p class="empty">Loading…</p></div>
      <form class="add-form" id="addSiteForm">
        <input id="newSiteInput" type="text"
               placeholder="Add domain (e.g. app.mycompany.com)" autocomplete="off">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </div>
  </div>

  <!-- ── Active DNR Rules ─────────────────────────────────── -->
  <div class="section">
    <div class="section-head">
      <h2>Active DNR Rules</h2>
      <button class="btn btn-ghost btn-sm" id="refreshRules">Refresh</button>
    </div>
    <div class="section-body">
      <pre id="rulesOutput">Loading…</pre>
    </div>
  </div>

  <!-- ── Cookie Status ────────────────────────────────────── -->
  <div class="section">
    <div class="section-head">
      <h2>Cookie Status</h2>
    </div>
    <div class="section-body">
      <div id="cookieStatus"><p class="empty">Loading…</p></div>
    </div>
  </div>

  <!-- ── Storage Inspector ────────────────────────────────── -->
  <div class="section">
    <div class="section-head">
      <h2>Storage Inspector</h2>
      <button class="btn btn-ghost btn-sm" id="exportStorage">Export JSON</button>
    </div>
    <div class="section-body">
      <pre id="storageOutput">Loading…</pre>
    </div>
  </div>

  <!-- ── Danger Zone ──────────────────────────────────────── -->
  <div class="section danger-zone">
    <div class="section-head">
      <h2>Danger Zone</h2>
    </div>
    <div class="section-body">
      <p style="font-size:13px;color:#64748b;margin-bottom:14px">
        These actions are irreversible. All site configs, cookies, and active rules will be removed.
      </p>
      <button class="btn btn-danger" id="clearStorage">Clear all SWITCH data</button>
    </div>
  </div>

</div>

<script type="module" src="devtools.js"></script>
</body>
</html>

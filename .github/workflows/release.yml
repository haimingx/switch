name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version to manifest.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Package extension
        run: |
          zip -r switch-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            constants.js \
            popup.html \
            popup.js \
            devtools.html \
            devtools.js \
            content_ws.js \
            content_bridge.js \
            rules.json \
            modules/ \
            icon16.png \
            icon48.png \
            icon128.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SWITCH ${{ github.ref_name }}
          body: |
            Switch any domain's outbound connections to a target backend, with cookies auto-injected.

            ### Installation
            1. Download `switch-${{ github.ref_name }}.zip`
            2. Open `chrome://extensions/` → enable **Developer mode**
            3. Drag the zip file into the page
          files: switch-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

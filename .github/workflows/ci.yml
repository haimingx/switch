name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check scripts
        run: |
          for f in *.js modules/*.js tests/*.test.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: node --test tests/*.test.js
